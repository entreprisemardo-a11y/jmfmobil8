    </g>

    <!-- Service 4: Pièces Auto -->
    <g transform="translate(440, 265)" filter="url(#shadow)">
      <rect x="0" y="0" width="400" height="210" rx="20" fill="url(#card-grad)" stroke="#1E3A8A" stroke-width="1" />
      <circle cx="45" cy="45" r="22" fill="#8B5CF6" fill-opacity="0.2" />
      <text x="45" y="52" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">⚙️</text>
      <text x="85" y="42" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Pièces de Rechange</text>
      <text x="85" y="60" fill="#C4B5FD" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Fourniture Certifiée &amp; Logistique Express</text>
      <text x="30" y="105" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="400">
        • Pièces d'origine constructeur &amp; adaptables premium
      </text>
      <text x="30" y="132" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="400">
        • Approvisionnement rapide Europe - Afrique
      </text>
      <text x="30" y="159" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="400">
        • Devis sous 24h &amp; garantie constructeur
      </text>
      <rect x="30" y="178" width="130" height="20" rx="6" fill="#8B5CF6" fill-opacity="0.2" />
      <text x="95" y="192" fill="#E9D5FF" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">CERTIFIÉ CONSTRUCTEUR</text>
    </g>
  </g>

  <!-- Middle Banner: Centre de Stockage & Hub Logistique -->
  <g transform="translate(80, 770)" filter="url(#shadow)">
    <rect x="0" y="0" width="840" height="150" rx="20" fill="#0B1A30" stroke="#0284C7" stroke-width="1.2" />
    <g transform="translate(35, 30)">
      <circle cx="30" cy="30" r="30" fill="#0284C7" fill-opacity="0.2" />
      <text x="30" y="38" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="28" text-anchor="middle">🏢</text>
      <text x="80" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="800">
        Centre de Stockage Sécurisé &amp; Hub Opérationnel
      </text>
      <text x="80" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">
        Gardiennage permanent 24h/24, vidéo-surveillance HD, baies de lavage et contrôle d'accès numérique
      </text>
      <g transform="translate(80, 68)">
        <rect x="0" y="0" width="140" height="22" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="0.8" />
        <text x="70" y="15" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
          ✓ Accès Sécurisé 24/7
        </text>
        <rect x="155" y="0" width="165" height="22" rx="6" fill="#1E3A8A" stroke="#38BDF8" stroke-width="0.8" />
        <text x="237" y="15" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
          ✓ Véhicules Légers &amp; PL
        </text>
      </g>
    </g>
  </g>

  <!-- CRITICAL BOTTOM SECTION: Official Headquarters & Updated Address -->
  <g transform="translate(80, 955)" filter="url(#shadow)">
    <!-- Main Contacts Box -->
    <rect x="0" y="0" width="840" height="360" rx="24" fill="#060E1A" stroke="#38BDF8" stroke-width="2" />

    <!-- Top Glow Header of the Contact Box -->
    <path d="M 0 24 Q 0 0 24 0 L 816 0 Q 840 0 840 24 L 840 70 L 0 70 Z" fill="#0D1F38" />
    <circle cx="45" cy="35" r="16" fill="#0284C7" />
    <text x="45" y="42" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">📍</text>
    <text x="75" y="36" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="19" font-weight="900" letter-spacing="1">
      COORDONNÉES OFFICIELLES &amp; SIÈGE SOCIAL
    </text>
    <text x="75" y="55" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">
      Direction Générale • Hub Opérationnel Afrique
    </text>

    <!-- PROMINENT ADDRESS BLOCK (Updated As Requested: Vodjè lot 1061, Cotonou Bénin) -->
    <g transform="translate(35, 95)">
      <rect x="0" y="0" width="770" height="90" rx="16" fill="#0B1A30" stroke="#0284C7" stroke-width="1.5" />
      <circle cx="35" cy="45" r="20" fill="#0284C7" fill-opacity="0.25" />
      <text x="35" y="52" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">🏢</text>
      
      <text x="70" y="32" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
        ADRESSE OFFICIELLE DU SIÈGE SOCIAL :
      </text>
      
      <!-- Exact updated address requested by user -->
      <text x="70" y="64" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="0.5">
        Vodjè lot 1061, Cotonou, Bénin
      </text>

      <!-- Badge Référence -->
      <rect x="610" y="28" width="140" height="32" rx="10" fill="#047857" />
      <text x="680" y="49" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">
        ✓ Siège Officiel
      </text>
    </g>

    <!-- Phone & Contact Grid -->
    <g transform="translate(35, 205)">
      <!-- Box Benin -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="375" height="120" rx="14" fill="#091424" stroke="#1E3A5F" stroke-width="1" />
        <text x="20" y="30" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="800">
