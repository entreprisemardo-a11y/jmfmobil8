<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" width="1000" height="1400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="35%" stop-color="#0B152B" />
      <stop offset="70%" stop-color="#081022" />
      <stop offset="100%" stop-color="#02050B" />
    </linearGradient>

    <!-- Accent Blue Gradient -->
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0050B3" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1F38" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#081324" stop-opacity="0.95" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid-pattern" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="50" cy="50" r="1" fill="#38BDF8" fill-opacity="0.3" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1400" fill="url(#bg-grad)" />
  <rect width="1000" height="1400" fill="url(#grid-pattern)" opacity="0.6" />

  <!-- Luminous Orbs -->
  <circle cx="200" cy="200" r="280" fill="#0284C7" opacity="0.12" filter="blur(60px)" />
  <circle cx="850" cy="800" r="320" fill="#0050B3" opacity="0.15" filter="blur(80px)" />
  <circle cx="300" cy="1200" r="260" fill="#10B981" opacity="0.08" filter="blur(70px)" />

  <!-- Top Decorative Header Strip -->
  <rect x="0" y="0" width="1000" height="8" fill="url(#blue-glow)" />

  <!-- Header Section -->
  <g transform="translate(80, 80)">
    <!-- Badge -->
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.2" />
    <circle cx="20" cy="17" r="4.5" fill="#38BDF8" />
    <text x="35" y="22" fill="#E0F2FE" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">
      MOBILITÉ &amp; GESTION DE FLOTTE
    </text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="1">
      JMF MOBILITY SERVICES
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">
      L'Excellence Opérationnelle au Service des Entreprises &amp; Particuliers
    </text>

    <!-- Top Status Badges -->
    <g transform="translate(560, 10)">
      <rect x="0" y="0" width="280" height="75" rx="16" fill="#0B192E" stroke="#1E3A5F" stroke-width="1" />
      <text x="20" y="32" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">RÉSEAU AFRIQUE &amp; EUROPE</text>
      <text x="20" y="55" fill="#10B981" font-family="system-ui, sans-serif" font-size="14" font-weight="800">● 24/7 Assistance &amp; Hub</text>
    </g>
  </g>

  <!-- Core Services Showcase (4 Cards) -->
  <g transform="translate(80, 260)">
    <text x="0" y="0" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="2">
      NOS PÔLES D'EXPERTISE
    </text>

    <!-- Service 1: Location -->
    <g transform="translate(0, 25)" filter="url(#shadow)">
      <rect x="0" y="0" width="400" height="210" rx="20" fill="url(#card-grad)" stroke="#1E3A8A" stroke-width="1" />
      <circle cx="45" cy="45" r="22" fill="#0284C7" fill-opacity="0.2" />
      <text x="45" y="52" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">🚗</text>
      <text x="85" y="42" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Location de Véhicules</text>
      <text x="85" y="60" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Courte, Moyenne &amp; Longue Durée</text>
      <text x="30" y="105" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="400">
        • Berlines, SUV 4x4 &amp; Véhicules Utilitaires
      </text>
      <text x="30" y="132" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="400">
        • Options avec Chauffeur Pro ou Auto-conduite
      </text>
      <text x="30" y="159" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="400">
        • Assurance tous risques &amp; assistance 24/7
      </text>
      <rect x="30" y="178" width="130" height="20" rx="6" fill="#0284C7" fill-opacity="0.2" />
      <text x="95" y="192" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">DISPONIBILITÉ IMMÉDIATE</text>
    </g>

    <!-- Service 2: Gestion de Flotte -->
    <g transform="translate(440, 25)" filter="url(#shadow)">
      <rect x="0" y="0" width="400" height="210" rx="20" fill="url(#card-grad)" stroke="#1E3A8A" stroke-width="1" />
      <circle cx="45" cy="45" r="22" fill="#10B981" fill-opacity="0.2" />
      <text x="45" y="52" fill="#34D399" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">📊</text>
      <text x="85" y="42" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="800">Gestion de Flotte &amp; IoT</text>
      <text x="85" y="60" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Supervision Télématique Intelligente</text>
      <text x="30" y="105" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="400">
        • Télématique GPS 4G &amp; Contrôle Carburant
      </text>
      <text x="30" y="132" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="400">
        • Suivi TCO, Maintenance &amp; Alertes Vidange
      </text>
      <text x="30" y="159" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13" font-weight="400">
        • Conformité réglementaire (CNSR, TVM, ANaTT)
      </text>
      <rect x="30" y="178" width="130" height="20" rx="6" fill="#10B981" fill-opacity="0.2" />
      <text x="95" y="192" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">JUSQU'À -25% TCO</text>
    </g>

    <!-- Service 3: Convoyage -->
    <g transform="translate(0, 265)" filter="url(#shadow)">
      <rect x="0" y="0" width="400" height="210" rx="20" fill="url(#card-grad)" stroke="#1E3A8A" stroke-width="1" />
      <circle cx="45" cy="45" r="22" fill="#F59E0B" fill-opacity="0.2" />
      <text x="45" y="52" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle">🚚</text>
