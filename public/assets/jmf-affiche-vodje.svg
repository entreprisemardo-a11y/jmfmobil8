        </text>
        <text x="20" y="55" fill="#E2E8F0" font-family="monospace" font-size="15" font-weight="700">
          Fixe : +229 01 21 24 88 70
        </text>
        <text x="20" y="80" fill="#10B981" font-family="monospace" font-size="15" font-weight="800">
          WhatsApp &amp; Direct :
        </text>
        <text x="20" y="102" fill="#34D399" font-family="monospace" font-size="16" font-weight="800">
          +229 01 97 83 21 21
        </text>
      </g>

      <!-- Box Sénégal & Email -->
      <g transform="translate(395, 0)">
        <rect x="0" y="0" width="375" height="120" rx="14" fill="#091424" stroke="#1E3A5F" stroke-width="1" />
        <text x="20" y="28" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="800">
          🇸🇳 HUB SÉNÉGAL &amp; SUPPORT COMMERCIAL
        </text>
        <text x="20" y="50" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">
          📍 SICAP N°6760, Liberté 6, Dakar, Sénégal
        </text>
        <text x="20" y="75" fill="#10B981" font-family="monospace" font-size="14" font-weight="800">
          Appel &amp; WhatsApp : +221 77 598 43 92
        </text>
        <text x="20" y="102" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">
          ✉ contact@jmfmobilityservices.com
